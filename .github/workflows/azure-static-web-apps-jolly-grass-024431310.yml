name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.20.8'
      - name: Install Dependencies
        run: npm install
      - name: Install Dev Dependencies
        run: npm install --save-dev @angular-devkit/build-angular
      - name: Install Angular CLI
        run: npm install -g @angular/cli
      - name: Build
        working-directory: ${{ github.workspace }}
        run: ng build --configuration production
      - name: List Build Output
        working-directory: ${{ github.workspace }}/dist/weather-app
        run: ls -la || dir  # Use ls for Linux, dir as fallback
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_GRASS_024431310 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          app_location: "/"
          api_location: ""
          output_location: "dist/weather-app/browser"  # Updated to include /browser
          action: "upload"
          # Repository/Build Configurations - These values can be configured to match your app requirements.
          # For more information, visit: https://aka.ms/swaworkflowconfig

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_GRASS_024431310 }}
          action: "close"